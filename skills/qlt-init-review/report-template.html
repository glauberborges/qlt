<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review qlt</title>
<style>
:root{
  --bg:#f6f7f9;--surface:#fff;--surface2:#f0f2f5;--text:#1c2330;--muted:#5d6878;--border:#dde1e8;
  --critical:#b42318;--high:#c2410c;--medium:#a16207;--low:#1d6fa5;--info:#667085;
  --ok:#157347;--warn:#a16207;--bad:#b42318;--accent:#2f5fd0;
  --medium-bg:#fef6dc;--low-bg:#e6f1fa;--info-bg:#eef0f3;--high-bg:#fde9dc;--critical-bg:#fde4e1;--ok-bg:#e3f4ea;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10141b;--surface:#181e28;--surface2:#212937;--text:#e6e9ef;--muted:#9aa5b5;--border:#2c3646;
    --critical:#ff8a80;--high:#ffab76;--medium:#f2c94c;--low:#7fbdf0;--info:#a3adbd;
    --ok:#6fd49a;--warn:#f2c94c;--bad:#ff8a80;--accent:#8fb0ff;
    --medium-bg:#3a3014;--low-bg:#14293b;--info-bg:#232b38;--high-bg:#3b2316;--critical-bg:#3d1b18;--ok-bg:#16301f;
  }
}
:root[data-theme="dark"]{
  --bg:#10141b;--surface:#181e28;--surface2:#212937;--text:#e6e9ef;--muted:#9aa5b5;--border:#2c3646;
  --critical:#ff8a80;--high:#ffab76;--medium:#f2c94c;--low:#7fbdf0;--info:#a3adbd;
  --ok:#6fd49a;--warn:#f2c94c;--bad:#ff8a80;--accent:#8fb0ff;
  --medium-bg:#3a3014;--low-bg:#14293b;--info-bg:#232b38;--high-bg:#3b2316;--critical-bg:#3d1b18;--ok-bg:#16301f;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:17px;margin:32px 0 12px}
code{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface2);padding:1px 5px;border-radius:4px;word-break:break-all}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:13px;margin:-6px 0 10px}
.top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.theme{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;font-size:13px}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.v-approved{color:var(--ok);background:var(--ok-bg)}
.v-changes_requested{color:var(--warn);background:var(--medium-bg)}
.v-blocked{color:var(--bad);background:var(--critical-bg)}
.s-critical{color:var(--critical);background:var(--critical-bg)}
.s-high{color:var(--high);background:var(--high-bg)}
.s-medium{color:var(--medium);background:var(--medium-bg)}
.s-low{color:var(--low);background:var(--low-bg)}
.s-info{color:var(--info);background:var(--info-bg)}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;margin-top:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px}
.card h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.counts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cnt{font-size:12px;padding:1px 8px;border-radius:6px}
.cnt.zero{opacity:.4}
.summary-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:8px}
.summary-row .card{text-align:center;padding:10px}
.summary-row .n{font-size:26px;font-weight:700;line-height:1.1;background:none}
.summary-row .l{font-size:12px;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters .lbl{color:var(--muted);font-size:13px}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:99px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.finding{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--info);border-radius:10px;margin-bottom:10px}
.finding.sev-critical{border-left-color:var(--critical)}.finding.sev-high{border-left-color:var(--high)}
.finding.sev-medium{border-left-color:var(--medium)}.finding.sev-low{border-left-color:var(--low)}
.finding summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.finding summary::-webkit-details-marker{display:none}
.finding summary .t{flex:1;font-weight:600}
.finding summary::after{content:"+";color:var(--muted);font-size:18px;line-height:1}
.finding[open] summary::after{content:"–"}
.body{padding:0 14px 14px;border-top:1px solid var(--border)}
.body dl{margin:12px 0 0;display:grid;grid-template-columns:130px 1fr;gap:8px 14px}
.body dt{color:var(--muted);font-size:13px}
.body dd{margin:0}
.body ul{margin:0;padding-left:18px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:12px;background:var(--surface2);border-radius:6px;padding:1px 8px}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;font-size:13.5px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top}
th{background:var(--surface2);font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
tr:last-child td{border-bottom:0}
.tblwrap{overflow-x:auto}
.q{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.note{background:var(--medium-bg);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:12px}
.pass{color:var(--ok);font-weight:600}
.warn{color:var(--warn);font-weight:600}
.fail{color:var(--bad);font-weight:600}
.small{font-size:13.5px}
.list{margin:0;padding-left:18px}
@media (max-width:640px){
  .summary-row{grid-template-columns:repeat(3,1fr)}
  .body dl{grid-template-columns:1fr;gap:2px}
  .body dt{margin-top:8px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1 id="title">Review qlt</h1>
      <div class="muted" id="subtitle"></div>
    </div>
    <button class="theme" id="theme" type="button">Alternar tema</button>
  </div>
  <div class="meta" id="meta"></div>
  <noscript><p class="note">Este relatório precisa de JavaScript. O mesmo conteúdo está em <code>90-final.md</code>.</p></noscript>

  <section id="sec-totals">
    <h2>Contagem</h2>
    <div class="hint" id="countNote" hidden></div>
    <div class="summary-row" id="totals"></div>
  </section>

  <section id="sec-reviewers" hidden>
    <h2>Revisores</h2>
    <div class="cards" id="reviewers"></div>
  </section>

  <section id="sec-findings">
    <h2>Achados</h2>
    <div class="filters" id="filters"></div>
    <div id="findings"></div>
  </section>

  <section id="sec-questions" hidden>
    <h2>Perguntas para o dev</h2>
    <div id="questions"></div>
  </section>

  <section id="sec-checks" hidden>
    <h2>Verificação do qa</h2>
    <div class="note" id="qaNote" hidden></div>
    <div class="tblwrap"><table id="tests"></table></div>
  </section>

  <section id="sec-extra" hidden>
    <h2>Outras verificações</h2>
    <div class="cards" id="extra"></div>
  </section>

  <section id="sec-gaps" hidden>
    <h2>O que ficou de fora</h2>
    <ul class="muted" id="gaps"></ul>
  </section>

  <section id="sec-rules" hidden>
    <h2>Regras propostas para <code>.claude/qlt/</code></h2>
    <div class="hint" id="rulesNote" hidden></div>
    <div id="rules"></div>
  </section>
</div>

<script>
// O coordenador troca a linha abaixo pelo conteúdo de 90-final.json. Não edite o resto à mão.
const D =
/*QLT_DATA*/null
;

const SEV = ["critical","high","medium","low","info"];
const A = x => Array.isArray(x) ? x : [];
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = s => esc(s).replace(/`([^`\n]+)`/g, "<code>$1</code>");   // `trecho` vira <code>
const cls = s => String(s == null ? "" : s).replace(/[^a-z_]/gi, "");
const show = (id, on) => { $(id).hidden = !on; };

function render(D){
  document.title = D.title || "Review qlt";
  $("title").textContent = D.title || "Review qlt";
  $("subtitle").textContent = D.subtitle || "";
  $("meta").innerHTML =
    `<span><span class="badge v-${cls(D.verdict)}">${esc(D.verdict)}</span></span>` +
    A(D.meta).map(m => `<span class="muted">${fmt(m)}</span>`).join("");

  const findings = A(D.findings), reviewers = A(D.reviewers);

  // totais (depois de fundir duplicados: contam os achados deste arquivo)
  const tot = Object.fromEntries(SEV.map(s => [s, findings.filter(f => f.sev === s).length]));
  $("totals").innerHTML = SEV.map(s =>
    `<div class="card"><div class="n s-${s}">${tot[s]}</div><div class="l">${s}</div></div>`).join("");
  if (D.countNote){ $("countNote").innerHTML = fmt(D.countNote); show("countNote", true); }

  // revisores
  show("sec-reviewers", reviewers.length > 0);
  $("reviewers").innerHTML = reviewers.map(r => `
    <div class="card">
      <h3>${esc(r.k)} <span class="badge v-${cls(r.v)}">${esc(r.v)}</span></h3>
      <div class="muted small">${fmt(r.d)}</div>
      <div class="counts">${SEV.map(s => { const n = (r.c || {})[s] || 0;
        return `<span class="cnt s-${s} ${n ? "" : "zero"}">${s} ${n}</span>`; }).join("")}</div>
    </div>`).join("");

  // filtros e achados
  const state = {sev:new Set(), rev:new Set()};
  const chip = (label, group, val) =>
    `<button type="button" class="chip" data-g="${group}" data-v="${esc(val)}" aria-pressed="false">${esc(label)}</button>`;
  $("filters").innerHTML =
    `<span class="lbl">Severidade:</span>` + SEV.filter(s => tot[s]).map(s => chip(`${s} (${tot[s]})`, "sev", s)).join("") +
    (reviewers.length ? `<span class="lbl" style="margin-left:10px">Revisor:</span>` + reviewers.map(r => chip(r.k, "rev", r.k)).join("") : "") +
    `<button type="button" class="chip" id="expand">Expandir todos</button>`;

  function renderFindings(){
    const list = findings.filter(f =>
      (!state.sev.size || state.sev.has(f.sev)) &&
      (!state.rev.size || A(f.rev).some(r => state.rev.has(r))));
    $("findings").innerHTML = list.length ? list.map(f => `
      <details class="finding sev-${cls(f.sev)}" ${["critical","high","medium"].includes(f.sev) ? "open" : ""}>
        <summary>
          <span class="badge s-${cls(f.sev)}">${esc(f.sev)}</span>
          <span class="t">${fmt(f.title)}</span>
          <span class="tags">${A(f.rev).map(r => `<span class="tag">${esc(r)}</span>`).join("")}</span>
        </summary>
        <div class="body"><dl>
          ${A(f.where).length ? `<dt>Onde</dt><dd><ul>${A(f.where).map(w => `<li><code>${esc(w)}</code></li>`).join("")}</ul></dd>` : ""}
          <dt>Problema</dt><dd>${fmt(f.problem)}</dd>
          ${f.evidence ? `<dt>Evidência</dt><dd>${fmt(f.evidence)}</dd>` : ""}
          ${f.fix ? `<dt>Correção mínima</dt><dd>${fmt(f.fix)}</dd>` : ""}
          ${f.conf ? `<dt>Confiança</dt><dd>${esc(f.conf)}</dd>` : ""}
        </dl></div>
      </details>`).join("") : `<div class="muted">${findings.length ? "Nenhum achado com esse filtro." : "Nenhum achado."}</div>`;
  }
  $("filters").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.id === "expand"){
      const ds = [...document.querySelectorAll("#findings details")];
      const open = ds.some(d => !d.open);
      ds.forEach(d => d.open = open);
      b.textContent = open ? "Recolher todos" : "Expandir todos";
      return;
    }
    const set = state[b.dataset.g], v = b.dataset.v;
    set.has(v) ? set.delete(v) : set.add(v);
    b.setAttribute("aria-pressed", set.has(v));
    renderFindings();
  });
  renderFindings();

  // seções opcionais: só aparecem quando há dado
  const questions = A(D.questions);
  show("sec-questions", questions.length > 0);
  $("questions").innerHTML = questions.map((q, i) => `<div class="q"><b>${i + 1}.</b> ${fmt(q)}</div>`).join("");

  const checks = A(D.checks);
  show("sec-checks", checks.length > 0 || !!D.qaNote);
  if (D.qaNote){ $("qaNote").innerHTML = fmt(D.qaNote); show("qaNote", true); }
  const MARK = {ok:["pass","✓"], warn:["warn","!"], fail:["fail","✗"]};
  $("tests").innerHTML = checks.length
    ? `<thead><tr><th>Comando / alvo</th><th>Resultado</th><th></th></tr></thead><tbody>` +
      checks.map(t => { const m = MARK[t[2]] || ["", ""];
        return `<tr><td>${fmt(t[0])}</td><td>${fmt(t[1])}</td><td class="${m[0]}">${m[1]}</td></tr>`; }).join("") + `</tbody>`
    : "";

  const extra = A(D.extra);
  show("sec-extra", extra.length > 0);
  $("extra").innerHTML = extra.map(x =>
    `<div class="card"><h3>${esc(x.t)}</h3><ul class="list small">${A(x.items).map(i => `<li>${fmt(i)}</li>`).join("")}</ul></div>`).join("");

  const gaps = A(D.gaps);
  show("sec-gaps", gaps.length > 0);
  $("gaps").innerHTML = gaps.map(g => `<li>${fmt(g)}</li>`).join("");

  const rules = A(D.rules);
  show("sec-rules", rules.length > 0);
  if (D.rulesNote){ $("rulesNote").innerHTML = fmt(D.rulesNote); show("rulesNote", true); }
  $("rules").innerHTML = rules.map(r => `<div class="q"><code>${esc(r[0])}</code> ${fmt(r[1])}</div>`).join("");
}

if (D) render(D);
else document.querySelector(".wrap").innerHTML = '<p class="muted">Modelo sem dados: gere o relatório a partir do <code>90-final.json</code>.</p>';

if ($("theme")) $("theme").addEventListener("click", () => {
  const cur = document.documentElement.dataset.theme ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark";
});
</script>
</body>
</html>
